name: faskhaninja_vendor
description: "A new Flutter project."
publish_to: 'none'

#android
version: 1.0.29+31

#IOS
#version: 1.0.33+1


environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  timeago: ^3.7.0
  provider: ^6.1.2
  hive_flutter: ^1.1.0
  permission_handler: ^12.0.1

  hive: ^2.2.3
  easy_localization: ^3.0.7
  country_picker: ^2.0.26
  bot_toast: ^4.1.3
  custom_timer: ^0.2.3
  flutter_svg: ^2.0.10+1
  pinput: ^5.0.0
  cached_network_image: ^3.3.1
  loading_animation_widget: ^1.2.1
  shimmer_animation: ^2.2.1

  photo_view: ^0.15.0
  image_picker: ^1.1.2
  dio: ^5.5.0+1
  http: ^1.2.2
  http_parser: ^4.0.2
  mime: ^1.0.5
  path: ^1.9.0
  path_provider: ^2.1.3
  pretty_dio_logger: ^1.4.0
  logger: ^2.6.1
  connectivity_plus: ^6.1.2
  url_launcher: ^6.3.0
  intl: ^0.20.2
  flutter_svg_provider: ^1.0.7
  flutter_widget_from_html: ^0.15.1
  geolocator: ^10.1.0
  geocoding: ^3.0.0
  google_maps_flutter: ^2.5.0

  flutter_local_notifications: ^17.2.2
  firebase_messaging: ^15.2.2
  firebase_core: ^3.11.0
  cloud_firestore: ^5.6.3
  googleapis: ^13.1.0
  googleapis_auth: ^1.6.0
  collection: ^1.18.0
  uuid: ^4.5.0
  grouped_list: ^6.0.0
  webview_flutter: ^4.8.0
  webview_flutter_android: ^3.16.6
  webview_flutter_wkwebview: ^3.18.4
  audioplayers: ^6.1.0
  flutter_polyline_points: ^2.0.0
  location: ^7.0.0
  defer_pointer: ^0.0.2
  pusher_channels_flutter: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/langs/
    - assets/images/
    - assets/svg/
    - assets/global_icon/
    - assets/
    - assets/sound/
    - assets/map_styles/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/font/Roboto/Roboto-Regular.ttf
          weight: 400
        - asset: assets/font/Roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/font/Roboto/Roboto-Bold.ttf
          weight: 700
        - asset: assets/font/Roboto/Roboto-Black.ttf
          weight: 900
    - family: Tajawal
      fonts:
        - asset: assets/font/Tajawal/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/font/Tajawal/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/font/Tajawal/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/font/Tajawal/Tajawal-Black.ttf
          weight: 900
